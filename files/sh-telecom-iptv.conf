# Shanghai Telecom IPTV daemon (udpxy-compatible relay + future soft-client)
#
# Sample network prerequisites (same on fw3/19.07 and fw4/25.12, UCI schema
# is identical - put these in /etc/config/network and /etc/config/firewall):
#
#   config interface 'iptv'
#       option device   'wan.85'      # or eth5.85 on older targets
#       option proto    'dhcp'
#       option defaultroute '0'
#
#   config route                       # carrier EPG/RTSP/HLS networks
#       option interface 'iptv'
#       option target '<carrier-epg-cidr>'
#       option gateway '<iptv-vlan-gateway>'
#   (add one route per carrier EPG/RTSP/HLS network prefix)
#
#   config zone
#       option name 'iptv'
#       list network 'iptv'
#       option input 'ACCEPT'          # the relay must receive multicast
#       option output 'ACCEPT'
#       option forward 'ACCEPT'
#       option masq '1'
#   config forwarding
#       option src 'lan'
#       option dest 'iptv'

config main 'main'
	# 0 = start the daemon, relay only listens once 'device' is set
	option disabled '0'

	# HTTP listen (udpxy-compatible URL space: /udp/G:P, /rtp/G:P, /status)
	option port '4022'
	option bind '0.0.0.0'

	# Source device for multicast join/leave, e.g. wan.85 / eth5.85.
	# Leave empty to run without the relay (status page only).
	option device ''

	# Explicit source IPv4 (default: first address of 'device')
	option bind_addr ''

	option max_clients '20'

	# RTP handling of inbound multicast: auto (detect MP2T/RTP, default),
	# always (force 12-byte header strip), never (relay payload as-is)
	option rtp 'auto'

	# Reorder out-of-order RTP packets in a small window (40 ms) so
	# network jitter does not corrupt the TS stream.  RTP only; has no
	# effect on in-order streams and no effect when rtp=never.
	option reorder '1'

	# FCC fast channel change (0.6): on every channel join, ask the
	# channel's operator-designated FCC server (ChannelFCCIP/Port from
	# the ottauth channel list, RTCP FMT=2) to push an accelerated
	# unicast copy so playback starts from an IDR immediately; falls
	# back to plain multicast after 80 ms without a response, so a
	# broken/unreachable server only costs latency, never playback.
	# Before the channel list is built (first minutes after boot), or
	# for channels the operator does not provision, the optional
	# fcc_server list below is used instead.
	option fcc '1'

	# Optional fallback FCC servers (ip:port) for channels without
	# operator-provisioned FCC data.  Keep empty to rely on the
	# operator channel list alone.
	list fcc_server ''

	# AC-3 -> AAC audio transcode for the 4K channels (1.1).  Those
	# channels carry HEVC + AC-3, and browser MSE cannot decode AC-3:
	# without this the picture plays but there is no sound and the
	# volume control does nothing (the Olympic 4K channel 9999, whose
	# audio is not AC-3, works natively).  Runs one ffmpeg process per
	# stream (video copied, audio re-encoded to stereo AAC), so the
	# ffmpeg package must be installed on the device; without ffmpeg
	# the raw stream is served exactly as before.
	option xcode '1'

	# 0=err 1=warn 2=info 3=debug (syslog + stderr)
	option log '2'

config account 'account'
	# Soft-STB credentials; fill all three to enable the auth chain
	# (4kLogAuth -> ottauth -> EPG session, refreshed every 3h).
	# userid / sn / mac mirror IPTV_USERID / IPTV_SN / IPTV_MAC of the
	# python reference implementation.
	option userid ''
	option sn ''
	option mac ''

	# EPG auth server (host:port); Shanghai Telecom default is built
	# into the daemon, override here for other regions/deploys.
	option auth_host ''
